{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-4">

        <div class="card p-4 text-center">

            <h3>Login</h3>

            <form method="POST">

                <input type="email" name="email" class="form-control mt-3" placeholder="Email">

                <input type="password" name="password" class="form-control mt-3" placeholder="Password">

                <button class="btn btn-gradient mt-3 w-100">Login</button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
