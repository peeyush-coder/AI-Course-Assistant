{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card glass-card p-4 shadow-lg text-center">

            <h3>📂 Upload FAQ JSON</h3>

            <form method="POST" enctype="multipart/form-data">

                <input type="file" name="file" accept=".json"
                       class="form-control mt-3">

                <button class="btn btn-gradient mt-4 w-100">
                    Upload & Train AI 🚀
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
